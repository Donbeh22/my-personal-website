<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stories – Helia Soren</title>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .sample-label {
      margin: 2rem 0 0.75rem;
      text-align: center;
      font-family: var(--font-hand);
      font-size: 1.5rem;
      color: #5a3414;
    }
    .sample-label::before, .sample-label::after { content: " ✦ "; font-size: 1rem; opacity: 0.7; }

    .story-page {
      padding: clamp(1.25rem, 4vw, 2.25rem);
      background: rgba(255, 255, 255, 0.4);
      border: 1px solid #b8975c;
      border-radius: 4px;
      box-shadow: inset 0 0 30px rgba(139, 94, 40, 0.15);
    }
    .story-page h2.story-title {
      margin: 0 0 1.25rem;
      text-align: center;
      font-size: 2rem;
    }
    .story-page p {
      margin: 0 0 1em;
      line-height: 1.8;
      text-align: left;
    }
    /* Indent each paragraph like a printed book (except the first) */
    .story-page p + p { text-indent: 1.5em; margin-top: 0; }

    .download {
      margin: 1.5rem 0 0;
      text-align: center;
      font-size: 0.95rem;
    }
  </style>
</head>
