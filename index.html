  <!-- Shown briefly on touch screens only -->
  <p class="touch-hint" aria-hidden="true">Tap around the room to explore</p>

  <!-- Sound on/off -->
  <button id="sound-toggle" class="sound-toggle" type="button" aria-label="Toggle sound">🔇</button>
  <audio id="bgm" src="ambient.mp3" loop preload="auto"></audio>

  <!-- Keyboard / screen reader navigation (appears when you press Tab) -->
  <nav class="fallback-nav" aria-label="Site navigation">
    <a href="about.html">About</a>
    <a href="projects.html">Projects</a>
    <a href="connect.html">Connect</a>

    <a href="moce.html">Moce Seone</a>
    <a href="cloud.html">Cloud</a>
    <a href="flying-car.html">Flying Car</a>
  </nav>

  <script>
    (function () {
      var audio = document.getElementById('bgm');
      var btn = document.getElementById('sound-toggle');
      var VOLUME = 0.10;            /* 0 = silent, 1 = full. Change this to taste. */
      var events = ['pointerdown', 'pointerup', 'click', 'touchend', 'keydown'];
      var muted = false;

      audio.volume = VOLUME;
      try { muted = localStorage.getItem('bgm-muted') === '1'; } catch (e) {}

      function render() {
        var on = !muted && !audio.paused;
        btn.textContent = on ? '🔊' : '🔇';
        btn.setAttribute('aria-pressed', on ? 'true' : 'false');
      }

      function cleanup() {
        events.forEach(function (e) { document.removeEventListener(e, start); });
      }

      /* Browsers block sound until the visitor interacts, so we try right away
         and, if blocked, start on the first tap, click, or key press. */
      function start() {
        if (muted) return;
        var p = audio.play();
        if (p && p.then) {
          p.then(function () { cleanup(); render(); }).catch(function () {});
        }
      }

      events.forEach(function (e) { document.addEventListener(e, start); });

      /* Keep presses on the sound button from triggering the auto-start */
      events.forEach(function (e) {
        btn.addEventListener(e, function (ev) { ev.stopPropagation(); });
      });

      btn.addEventListener('click', function () {
        if (muted || audio.paused) {
          muted = false;
          audio.play().catch(function () {});
        } else {
          muted = true;
          audio.pause();
        }
        try { localStorage.setItem('bgm-muted', muted ? '1' : '0'); } catch (e) {}
        render();
      });

      audio.addEventListener('play', render);
      audio.addEventListener('pause', render);

      render();
      start();
    })();
  </script>

</body>
</html>
