  <style>
    /* Gentle pulse on the sound button while the music is waiting to start.
       To remove the pulse entirely, delete this whole <style> block. */
    body.needs-sound .sound-toggle {
      animation: soundPulse 2.2s ease-in-out infinite;
      opacity: 1;
    }
    @keyframes soundPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255, 207, 107, 0); }
      50%      { box-shadow: 0 0 14px 4px rgba(255, 207, 107, 0.5); }
    }
  </style>

  <script>
    (function () {
      var audio = document.getElementById('bgm');
      var btn = document.getElementById('sound-toggle');
      var VOLUME = 0.25;            /* 0 = silent, 1 = full. Change this to taste. */
      var KEY = 'bgm-muted-v2';
      var muted = false;

      /* Only gestures that browsers accept as "permission to play sound" */
      var events = ['pointerdown', 'mousedown', 'click', 'touchend', 'keydown'];

      audio.volume = VOLUME;
      try { muted = localStorage.getItem(KEY) === '1'; } catch (e) {}

      function render() {
        var playing = !audio.paused;
        btn.textContent = playing ? '🔊' : '🔇';
        btn.setAttribute('aria-pressed', playing ? 'true' : 'false');
        /* Pulse the button only while waiting for sound to start */
        document.body.classList.toggle('needs-sound', !playing && !muted);
      }

      function cleanup() {
        events.forEach(function (e) { document.removeEventListener(e, start, true); });
      }

      /* Try immediately; if the browser blocks it, start on the first click,
         tap, or key press anywhere on the page. */
      function start() {
        if (muted || !audio.paused) return;
        var p = audio.play();
        if (p && p.then) {
          p.then(function () { cleanup(); render(); }).catch(function () {});
        }
      }

      events.forEach(function (e) { document.addEventListener(e, start, true); });

      /* Sound button: toggles on/off (and remembers the choice) */
      btn.addEventListener('click', function (ev) {
        ev.stopPropagation();
        if (audio.paused) {
          muted = false;
          audio.play().then(render).catch(function () {});
        } else {
          muted = true;
          audio.pause();
        }
        try { localStorage.setItem(KEY, muted ? '1' : '0'); } catch (e) {}
        render();
      });

      audio.addEventListener('play', render);
