<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Helia Soren – Daydreamer</title>
  <meta name="description" content="A personal website. Explore the room to find what's hidden.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">

  <style>
    /* Gentle pulse on the sound button while the music is waiting to start. */
    body.needs-sound .sound-toggle {
      animation: soundPulse 2.2s ease-in-out infinite;
      opacity: 1;
    }
    @keyframes soundPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255, 207, 107, 0); }
      50%      { box-shadow: 0 0 14px 4px rgba(255, 207, 107, 0.5); }
    }

    /* Temporary on-screen debug message (see DEBUG in the script) */
    .audio-debug {
      position: fixed;
      left: 0.5rem;
      bottom: 0.5rem;
      max-width: 90vw;
      margin: 0;
      padding: 0.3rem 0.6rem;
      font: 12px/1.3 monospace;
      color: #fff;
      background: rgba(0, 0, 0, 0.8);
      border-radius: 4px;
      z-index: 99;
      pointer-events: none;
    }
  </style>
</head>
<body class="home">

  <main class="stage" aria-label="Explorable room illustration">

    <!-- px/py = position on the portrait image (phones)
         lx/ly = position on the landscape image (desktops) -->
    <a class="hotspot" href="about.html"      style="--px: 30%;   --py: 54%;   --lx: 41%;   --ly: 53%;">About</a>
    <a class="hotspot" href="projects.html"   style="--px: 19%;   --py: 42%;   --lx: 35.5%; --ly: 47%;">Projects</a>
    <a class="hotspot" href="connect.html"    style="--px: 64.5%; --py: 62.5%; --lx: 57%;   --ly: 59%;">Connect</a>
    <a class="hotspot" href="burning.html"    style="--px: 49.5%; --py: 85%;   --lx: 50%;   --ly: 86.5%;">For Burning</a>
    <a class="hotspot" href="puzzle.html"     style="--px: 7%;    --py: 93%;   --lx: 29%;   --ly: 92%;">Puzzle</a>
    <a class="hotspot" href="stories.html"    style="--px: 27%;   --py: 94%;   --lx: 38.5%; --ly: 90%;">Stories</a>
    <a class="hotspot" href="misc.html"       style="--px: 60%;   --py: 95%;   --lx: 54%;   --ly: 92%;">Misc</a>

    <!-- More easter eggs -->
    <a class="hotspot wrap" href="words.html"      style="--px: 85.5%; --py: 84%;   --lx: 67%;   --ly: 85.5%;">Words Words Words Everywhere</a>
    <a class="hotspot"      href="moce.html"       style="--px: 81%;   --py: 50%;   --lx: 64.7%; --ly: 48.2%;">Moce Seone</a>
    <a class="hotspot"      href="cloud.html"      style="--px: 57.3%; --py: 12.5%; --lx: 53.3%; --ly: 14.3%;">Possible Cloud</a>
    <a class="hotspot"      href="flying-car.html" style="--px: 45.4%; --py: 43%;   --lx: 48.3%; --ly: 39.5%;">Flying Car</a>

  </main>

  <!-- Shown briefly on touch screens only -->
  <p class="touch-hint" aria-hidden="true">Tap around the room to explore</p>

  <!-- Sound on/off -->
  <button id="sound-toggle" class="sound-toggle" type="button" aria-label="Toggle sound">🔇</button>
  <audio id="bgm" src="ambient.mp3?v=2" loop preload="auto" playsinline></audio>
  <p id="audio-debug" class="audio-debug" hidden></p>

  <!-- Keyboard / screen reader navigation (appears when you press Tab) -->
  <nav class="fallback-nav" aria-label="Site navigation">
    <a href="about.html">About</a>
    <a href="projects.html">Projects</a>
    <a href="connect.html">Connect</a>
    <a href="burning.html">For Burning</a>
    <a href="puzzle.html">Puzzle</a>
    <a href="stories.html">Stories</a>
    <a href="misc.html">Misc</a>
    <a href="words.html">Words</a>
    <a href="moce.html">Moce Seone</a>
    <a href="cloud.html">Cloud</a>
    <a href="flying-car.html">Flying Car</a>
  </nav>

  <script>
    (function () {
      var DEBUG = false;             /* set to false once the sound works */
      var VOLUME = 0.25;            /* 0 = silent, 1 = full */
      var KEY = 'bgm-muted-v4';

      var audio = document.getElementById('bgm');
      var btn = document.getElementById('sound-toggle');
      var dbg = document.getElementById('audio-debug');
      var muted = false;
      var broken = false;

      function log(msg) {
        if (!DEBUG) return;
        dbg.hidden = false;
        dbg.textContent = msg;
      }

      audio.volume = VOLUME;
      try { muted = localStorage.getItem(KEY) === '1'; } catch (e) {}

      function render() {
        var playing = !audio.paused;
        btn.textContent = playing ? '🔊' : '🔇';
        btn.setAttribute('aria-pressed', playing ? 'true' : 'false');
        document.body.classList.toggle('needs-sound', !playing && !muted && !broken);
      }

      function tryPlay(source) {
        var p;
        try { p = audio.play(); } catch (err) { log(source + ': play() threw ' + err.name); return; }
        if (p && p.then) {
          p.then(function () {
            log('Playing OK (' + source + ')');
            render();
          }).catch(function (err) {
            log(source + ': play failed: ' + err.name + ' - ' + err.message);
            render();
          });
        }
      }

      /* Auto-start on the first click, tap, or key press anywhere
         except the speaker button (which has its own handler). */
      function onGesture(ev) {
        if (ev.target && ev.target.closest && ev.target.closest('#sound-toggle')) return;
        if (muted || broken || !audio.paused) return;
        tryPlay(ev.type);
      }
      ['pointerup', 'click', 'touchend', 'keydown'].forEach(function (e) {
        document.addEventListener(e, onGesture, true);
      });

      /* Speaker button: toggles on/off */
      btn.addEventListener('click', function (ev) {
        ev.stopPropagation();
        if (audio.paused) {
          muted = false;
          try { localStorage.setItem(KEY, '0'); } catch (e) {}
          tryPlay('button');
        } else {
          muted = true;
          audio.pause();
          try { localStorage.setItem(KEY, '1'); } catch (e) {}
          log('Muted by button');
        }
        render();
      });

      /* If the mp3 can't load or decode, say so */
      audio.addEventListener('error', function () {
        broken = true;
        var code = audio.error ? audio.error.code : '?';
        log('AUDIO FILE ERROR (code ' + code + '). 3 = bad/corrupt file, 4 = not found or unsupported format.');
        render();
      });

      audio.addEventListener('loadeddata', function () { log('Audio file loaded. Click the room to start.'); });
      audio.addEventListener('play', render);
      audio.addEventListener('pause', render);

      render();
      log('Waiting for first click...');
    })();
  </script>

</body>
</html>
