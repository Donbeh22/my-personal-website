<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Possible Thought Cloud – Helia Soren</title>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .post-list { list-style: none; margin: 1rem 0 0; padding: 0; }
    .post-list li { padding: 0.9rem 0; border-bottom: 1px solid rgba(139, 94, 40, 0.35); }
    .post-list li:last-child { border-bottom: 0; }
    .post-list time {
      display: block;
      font-size: 0.85rem;
      letter-spacing: 0.05em;
      color: #7a5a35;
    }
    .post-list a {
      font-family: var(--font-hand);
      font-size: 1.7rem;
      line-height: 1.2;
      text-decoration: none;
      color: #5a3414;
    }
    .post-list a:hover { color: #b0561a; text-decoration: underline; }
    .status { font-style: italic; }
  </style>
</head>
<body class="subpage">

  <header class="page-header">
    <p class="kicker">notes from the clouds</p>
    <h1 class="page-title">Possible Thought Cloud</h1>
  </header>

  <main class="content-box">
    <p><p>
  I also write longer pieces on my <a href="https://substack.com/@heliasoren" target="_blank" rel="noopener">Substack</a>.
</p></p>

    <p id="status" class="status">Loading thoughts…</p>
    <ul id="posts" class="post-list"></ul>
  </main>

  <a class="back-link" href="index.html">&larr; Back to Home</a>

  <script>
    var API = 'https://api.github.com/repos/Donbeh22/my-personal-website/contents/thoughts';
    var list = document.getElementById('posts');
    var statusEl = document.getElementById('status');

    function prettyDate(name) {
      var m = name.match(/^(\d{4})-(\d{2})-(\d{2})/);
      if (!m) return '';
      var d = new Date(Date.UTC(+m[1], +m[2] - 1, +m[3]));
      return d.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric', timeZone: 'UTC' });
    }

    function fallbackTitle(name) {
      return name.replace(/^\d{4}-\d{2}-\d{2}-?/, '').replace(/\.txt$/i, '').replace(/-/g, ' ') || name;
    }

    fetch(API).then(function (r) {
      if (!r.ok) throw new Error('no list');
      return r.json();
    }).then(function (items) {
      var files = items
        .filter(function (f) { return f.type === 'file' && /\.txt$/i.test(f.name); })
        .map(function (f) { return f.name; })
        .sort().reverse();                       /* newest date first */

      if (!files.length) {
        statusEl.textContent = 'No thoughts yet. Check back soon.';
        return;
      }

      return Promise.all(files.map(function (name) {
        return fetch('thoughts/' + encodeURIComponent(name))
          .then(function (r) { return r.ok ? r.text() : ''; })
          .catch(function () { return ''; })
          .then(function (text) {
            var first = (text.split(/\r?\n/)[0] || '').replace(/^#+\s*/, '').trim();
            return { name: name, title: first || fallbackTitle(name) };
          });
      })).then(function (posts) {
        statusEl.hidden = true;
        posts.forEach(function (p) {
          var li = document.createElement('li');
          var t = document.createElement('time');
          t.textContent = prettyDate(p.name);
          var a = document.createElement('a');
          a.href = 'thought.html?p=' + encodeURIComponent(p.name);
          a.textContent = p.title;
          li.appendChild(t);
          li.appendChild(a);
          list.appendChild(li);
        });
      });
    }).catch(function () {
      statusEl.textContent = "Couldn't load the thoughts right now. Please try again in a little while.";
    });
  </script>

</body>
</html>
