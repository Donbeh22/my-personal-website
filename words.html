<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Words Words Words Everywhere – Helia Soren</title>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .page-header, .content-box { max-width: 64rem; }
    .viewer {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin-top: 1rem;
    }
    .frame {
      flex: 1;
      min-width: 0;
      text-align: center;
    }
    .frame img {
      display: inline-block;
      max-width: 100%;
      max-height: 70vh;
      width: auto;
      height: auto;
      border: 4px solid #5a3414;
      border-radius: 6px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
    }
    .arrow {
      flex: none;
      width: 2.75rem;
      height: 2.75rem;
      padding: 0 0 0.2rem;
      font-size: 2rem;
      line-height: 1;
      color: var(--paper);
      background: rgba(30, 18, 9, 0.75);
      border: 1px solid #5a3414;
      border-radius: 50%;
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s, box-shadow 0.2s;
    }
    .arrow:hover, .arrow:focus-visible {
      color: var(--glow);
      border-color: var(--glow);
      box-shadow: 0 0 12px rgba(255, 207, 107, 0.35);
      outline: none;
    }
    .arrow[hidden] { display: none; }
    .empty { text-align: center; font-style: italic; }
  </style>
</head>
<body class="subpage">

  <header class="page-header">
    <p class="kicker">a little of everything</p>
    <h1 class="page-title">Words Words Words Everywhere</h1>
  </header>

  <main class="content-box">
    <p></p>

    <div class="viewer">
      <button id="prev" class="arrow" type="button" aria-label="Previous picture" hidden>&#8249;</button>
      <div class="frame"><img id="slide" alt="Gallery picture" hidden></div>
      <button id="next" class="arrow" type="button" aria-label="Next picture" hidden>&#8250;</button>
    </div>
    <p id="empty" class="empty" hidden>Pictures coming soon.</p>
  </main>

  <a class="back-link" href="index.html">&larr; Back to Home</a>

  <script>
    /* Pictures are found automatically: gallery/1.jpg, gallery/2.jpg, gallery/3.jpg ... */
    var EXTS = ['jpg', 'jpeg', 'png', 'webp'];
    var photos = [];
    var index = 0;

    var slide = document.getElementById('slide');
    var prev = document.getElementById('prev');
    var next = document.getElementById('next');
    var empty = document.getElementById('empty');

    function show(i) {
      index = (i + photos.length) % photos.length;
      slide.src = photos[index];
      slide.hidden = false;
    }

    function ready() {
      if (photos.length === 0) { empty.hidden = false; return; }
      if (photos.length > 1) { prev.hidden = false; next.hidden = false; }
    }

    function probe(n) {
      var e = 0;
      (function tryNext() {
        if (e >= EXTS.length) { ready(); return; }
        var src = 'gallery/' + n + '.' + EXTS[e++];
        var t = new Image();
        t.onload = function () {
          photos.push(src);
          if (photos.length === 1) show(0);
          probe(n + 1);
        };
        t.onerror = tryNext;
        t.src = src;
      })();
    }
    probe(1);

    prev.addEventListener('click', function () { show(index - 1); });
    next.addEventListener('click', function () { show(index + 1); });

    document.addEventListener('keydown', function (e) {
      if (photos.length < 2) return;
      if (e.key === 'ArrowLeft') show(index - 1);
      if (e.key === 'ArrowRight') show(index + 1);
    });

    /* Swipe on phones */
    var startX = null;
    slide.addEventListener('touchstart', function (e) { startX = e.touches[0].clientX; }, { passive: true });
    slide.addEventListener('touchend', function (e) {
      if (startX === null || photos.length < 2) return;
      var dx = e.changedTouches[0].clientX - startX;
      if (Math.abs(dx) > 40) show(dx < 0 ? index + 1 : index - 1);
      startX = null;
    }, { passive: true });
  </script>

</body>
</html>
